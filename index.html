<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グランドクロス ＆ マジックアウト ツール</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1c1c1e;
            color: #f2f2f7;
            text-align: center;
            padding: 4px;
            margin: 0;
            touch-action: manipulation;
        }
        /* 11インチiPad横向きに最適化した全体コンテナ */
        .wrapper {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 6px;
            align-items: flex-start;
            box-sizing: border-box;
            padding: 0 2px;
        }
        .column {
            flex: 1;
            background: #2c2c2e;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            box-sizing: border-box;
            min-width: 0;
        }
        h2 {
            font-size: 13px;
            margin: 0 0 4px 0;
            color: #ff453a;
            white-space: nowrap;
        }
        /* グランドクロスのブロック枠 */
        .gc-block {
            background: #3a3a3c;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 6px;
            text-align: left;
        }
        .gc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-weight: bold;
            font-size: 11px;
            color: #ff9f0a;
            gap: 6px;
        }
        .section {
            background: #2c2c2e;
            padding: 5px;
            border-radius: 6px;
            margin-bottom: 4px;
            text-align: left;
            transition: opacity 0.2s;
        }
        .label {
            font-size: 10.5px;
            font-weight: bold;
            color: #0a84ff;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .label:hover {
            color: #4da3ff;
        }
        
        /* アイコンとボタン行のレイアウト構造 */
        .row-container {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .debuff-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .btn-group {
            display: flex;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        /* 共通ボタン基本スタイル */
        .touch-btn {
            flex: 1;
            padding: 4px 1px;
            font-size: 9.5px;
            font-weight: bold;
            border: 1.5px solid #48484a;
            border-radius: 5px;
            background: #3a3a3c;
            color: #aeaeb2;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* グランドクロスのデバフ行専用の幅比率 */
        .debuff-row .btn-speed {
            flex: 0.55;
            font-size: 9px;
        }
        .debuff-row .btn-truth {
            flex: 1.45;
            font-size: 9px;
            padding-left: 1px;
            padding-right: 1px;
        }

        /* 親スイッチ用ボタン */
        .gc-switch-btn {
            flex: 1;
            padding: 3px;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-true-master {
            background: #2c2c2e;
            border-color: #0a84ff;
            color: #0a84ff;
        }
        .btn-true-master.active {
            background: #0a84ff;
            color: white;
            border-color: #fff;
        }
        .btn-false-master {
            background: #2c2c2e;
            border-color: #ff453a;
            color: #ff453a;
        }
        .btn-false-master.active {
            background: #ff453a;
            color: white;
            border-color: #fff;
        }

        /* 選択されたときのカラー設定 */
        .touch-btn.selected-true {
            background: #0a84ff !important;
            color: white !important;
            border-color: #fff !important;
        }
        .touch-btn.selected-false {
            background: #ff453a !important;
            color: white !important;
            border-color: #fff !important;
        }
        .touch-btn.selected-early {
            background: #ff9f0a !important;
            color: white !important;
            border-color: #fff !important;
        }
        .touch-btn.selected-late {
            background: #af52de !important;
            color: white !important;
            border-color: #fff !important;
        }

        /* グレーアウトするスタイル */
        .section.disabled-section {
            opacity: 0.3;
        }
        .section.disabled-section .label {
            pointer-events: auto; 
        }
        .section.disabled-section .row-container {
            pointer-events: none;
        }

        .disable-badge {
            font-size: 8.5px;
            background: #48484a;
            color: #fff;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: normal;
        }

        /* ほのお・つなみ用結果表示 */
        .effect-result {
            font-size: 9.5px;
            font-weight: normal;
            color: #ff9f0a;
            background: #1c1c1e;
            padding: 2px 4px;
            border-radius: 4px;
        }

        #result-box {
            margin-top: 6px;
            padding: 6px;
            background: #1c1c1e;
            border-radius: 8px;
            border: 2px solid #0a84ff;
        }
        .result-title {
            font-size: 10px;
            color: #aeaeb2;
            margin-bottom: 2px;
        }
        .result-val {
            font-size: 13px;
            font-weight: bold;
        }
        .reset-btn {
            width: 100%;
            background: #636366;
            color: white;
            border: none;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 6px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 【左カラム】グランドクロス 1回目 -->
    <div class="column">
        <h2>グランドクロス 1回目</h2>
        <div style="font-size: 9px; color: #8e8e93; margin-bottom: 4px;">※項目名タップで無効(対象外)切替</div>
        
        <div class="gc-block">
            <div class="gc-header">
                <span>デバフ一括選択</span>
                <div class="btn-group" style="flex: 1;">
                    <button class="gc-switch-btn btn-true-master" onclick="setGroup('gc1', 'true', this)">本当</button>
                    <button class="gc-switch-btn btn-false-master" onclick="setGroup('gc1', 'false', this)">嘘</button>
                </div>
            </div>

            <!-- 呪詛 -->
            <div class="section debuff-row" data-group="gc1">
                <div class="label" onclick="toggleDisable(this)">
                    <span>呪詛</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="juso.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'early')">早</button>
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:見ない</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:見る</button>
                    </div>
                </div>
            </div>

            <!-- 加速度爆弾 -->
            <div class="section debuff-row" data-group="gc1">
                <div class="label" onclick="toggleDisable(this)">
                    <span>加速度爆弾</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="acceleration.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'early')">早</button>
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:止まる</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:動く</button>
                    </div>
                </div>
            </div>

            <!-- フォークライトニング -->
            <div class="section debuff-row" data-group="gc1">
                <div class="label" onclick="toggleDisable(this)">
                    <span>フォークライトニング</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="fork.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" id="fork1-early" onclick="handleWaterLightning1('early')">早</button>
                        <button class="touch-btn btn-speed" id="fork1-late" onclick="handleWaterLightning1('late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:1人</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:頭割り</button>
                    </div>
                </div>
            </div>

            <!-- 水圧縮 -->
            <div class="section debuff-row" data-group="gc1" style="margin-bottom: 0;">
                <div class="label" onclick="toggleDisable(this)">
                    <span>水圧縮</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="water.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" id="water1-early" onclick="handleWaterLightning1('early')">早</button>
                        <button class="touch-btn btn-speed" id="water1-late" onclick="handleWaterLightning1('late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:頭割り</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:1人</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ほのお判定ブロック -->
        <div class="section" style="background: #3a3a3c; margin-bottom: 0;">
            <div class="label" onclick="toggleDisable(this)">
                <span>🔥 ほのお</span>
                <span id="fire-res" class="effect-result">未選択</span>
            </div>
            <div class="row-container">
                <img src="fire.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                <div class="btn-group">
                    <button class="touch-btn" onclick="selectEffect('fire', 'true', this)">本当</button>
                    <button class="touch-btn" onclick="selectEffect('fire', 'false', this)">嘘</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 【真ん中カラム】グランドクロス 2回目 -->
    <div class="column">
        <h2>グランドクロス 2回目</h2>
        <div style="font-size: 9px; color: #8e8e93; margin-bottom: 4px;">※項目名タップで無効(対象外)切替</div>

        <div class="gc-block">
            <div class="gc-header">
                <span>デバフ一括選択</span>
                <div class="btn-group" style="flex: 1;">
                    <button class="gc-switch-btn btn-true-master" onclick="setGroup('gc2', 'true', this)">本当</button>
                    <button class="gc-switch-btn btn-false-master" onclick="setGroup('gc2', 'false', this)">嘘</button>
                </div>
            </div>

            <!-- 呪詛 -->
            <div class="section debuff-row" data-group="gc2">
                <div class="label" onclick="toggleDisable(this)">
                    <span>呪詛</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="juso.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'early')">早</button>
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:見ない</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:見る</button>
                    </div>
                </div>
            </div>

            <!-- 加速度爆弾 -->
            <div class="section debuff-row" data-group="gc2">
                <div class="label" onclick="toggleDisable(this)">
                    <span>加速度爆弾</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="acceleration.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'early')">早</button>
                        <button class="touch-btn btn-speed" onclick="selectSpeed(this, 'late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:止まる</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:動く</button>
                    </div>
                </div>
            </div>

            <!-- フォークライトニング -->
            <div class="section debuff-row" data-group="gc2">
                <div class="label" onclick="toggleDisable(this)">
                    <span>フォークライトニング</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="fork.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" id="fork2-early" onclick="handleWaterLightning2('early')">早</button>
                        <button class="touch-btn btn-speed" id="fork2-late" onclick="handleWaterLightning2('late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:1人</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:頭割り</button>
                    </div>
                </div>
            </div>

            <!-- 水圧縮 -->
            <div class="section debuff-row" data-group="gc2" style="margin-bottom: 0;">
                <div class="label" onclick="toggleDisable(this)">
                    <span>水圧縮</span>
                    <span class="disable-badge">付与</span>
                </div>
                <div class="row-container">
                    <img src="water.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                    <div class="btn-group">
                        <button class="touch-btn btn-speed" id="water2-early" onclick="handleWaterLightning2('early')">早</button>
                        <button class="touch-btn btn-speed" id="water2-late" onclick="handleWaterLightning2('late')">遅</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'true')">本当:頭割り</button>
                        <button class="touch-btn btn-truth" onclick="selectItem(this, 'false')">嘘:1人</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- つなみ判定ブロック -->
        <div class="section" style="background: #3a3a3c; margin-bottom: 0;">
            <div class="label" onclick="toggleDisable(this)">
                <span>🌊 つなみ</span>
                <span id="water-res" class="effect-result">未選択</span>
            </div>
            <div class="row-container">
                <img src="tsunami.png" alt="" class="debuff-icon" onerror="this.style.display='none'">
                <div class="btn-group">
                    <button class="touch-btn" onclick="selectEffect('water', 'true', this)">本当</button>
                    <button class="touch-btn" onclick="selectEffect('water', 'false', this)">嘘</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 【右カラム】マジックアウト判定 -->
    <div class="column">
        <h2>マジックアウト判定</h2>
        <div style="font-size: 10px; color: #30d158; margin-bottom: 4px; font-weight: bold; text-align: left;">▼ 判定入力</div>

        <div class="section">
            <div class="label" style="cursor: default;">1回目雷 (サンダガ)</div>
            <div class="btn-group">
                <button class="touch-btn" onclick="selectMagicVal('t1', 'shin', this)">真</button>
                <button class="touch-btn" onclick="selectMagicVal('t1', 'uso', this)">偽</button>
            </div>
        </div>

        <div class="section">
            <div class="label" style="cursor: default;">2回目氷 (ブリザガ)</div>
            <div class="btn-group">
                <button class="touch-btn" onclick="selectMagicVal('t2', 'shin', this)">真</button>
                <button class="touch-btn" onclick="selectMagicVal('t2', 'uso', this)">偽</button>
            </div>
        </div>

        <div class="section">
            <div class="label" style="cursor: default;">マジックチャージ 上段 (雷系)</div>
            <div class="btn-group">
                <button class="touch-btn" onclick="selectMagicVal('mc_top', 'shin', this)">真</button>
                <button class="touch-btn" onclick="selectMagicVal('mc_top', 'uso', this)">偽</button>
            </div>
        </div>

        <div class="section" style="margin-bottom: 6px;">
            <div class="label" style="cursor: default;">マジックチャージ 下段 (氷系)</div>
            <div class="btn-group">
                <button class="touch-btn" onclick="selectMagicVal('mc_bottom', 'shin', this)">真</button>
                <button class="touch-btn" onclick="selectMagicVal('mc_bottom', 'uso', this)">偽</button>
            </div>
        </div>

        <!-- 結果表示エリア -->
        <div id="result-box">
            <div class="result-title">【 判定結果 】</div>
            <div id="res-main" class="result-val" style="color: #aeaeb2;">未選択</div>
        </div>

        <button class="reset-btn" onclick="resetAll()">全リセット</button>
    </div>
</div>

<script>
    function toggleDisable(labelElem) {
        const section = labelElem.closest('.section');
        section.classList.toggle('disabled-section');
        const badge = labelElem.querySelector('.disable-badge');
        if (badge) {
            if (section.classList.contains('disabled-section')) {
                badge.innerText = "対象外";
                badge.style.background = "#2c2c2e";
                badge.style.color = "#636366";
            } else {
                badge.innerText = "付与";
                badge.style.background = "#48484a";
                badge.style.color = "#fff";
            }
        }
    }

    function selectSpeed(btnElement, speedType) {
        const parentGroup = btnElement.parentElement;
        const speedBtns = parentGroup.querySelectorAll('.btn-speed');
        speedBtns.forEach(b => b.classList.remove('selected-early', 'selected-late'));
        
        if (speedType === 'early') {
            btnElement.classList.add('selected-early');
        } else {
            btnElement.classList.add('selected-late');
        }
    }

    // 💡 1回目の水・雷をセットで完全自動連動（1回目ペア ＆ 2回目反転ペアを一発設定）
    function handleWaterLightning1(speedType) {
        const oppositeSpeed = (speedType === 'early') ? 'late' : 'early';

        // 1回目：水圧縮・フォークライトニング両方を同じにする
        const w1e = document.getElementById('water1-early');
        const w1l = document.getElementById('water1-late');
        const f1e = document.getElementById('fork1-early');
        const f1l = document.getElementById('fork1-late');

        [w1e, f1e].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(speedType==='early') b.classList.add('selected-early'); });
        [w1l, f1l].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(speedType==='late') b.classList.add('selected-late'); });

        // 2回目：水圧縮・フォークライトニング両方を逆（反対側）にする
        const w2e = document.getElementById('water2-early');
        const w2l = document.getElementById('water2-late');
        const f2e = document.getElementById('fork2-early');
        const f2l = document.getElementById('fork2-late');

        [w2e, f2e].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(oppositeSpeed==='early') b.classList.add('selected-early'); });
        [w2l, f2l].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(oppositeSpeed==='late') b.classList.add('selected-late'); });
    }

    // 2回目を直接触った場合も対称に連動させる
    function handleWaterLightning2(speedType) {
        const oppositeSpeed = (speedType === 'early') ? 'late' : 'early';

        const w2e = document.getElementById('water2-early');
        const w2l = document.getElementById('water2-late');
        const f2e = document.getElementById('fork2-early');
        const f2l = document.getElementById('fork2-late');

        [w2e, f2e].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(speedType==='early') b.classList.add('selected-early'); });
        [w2l, f2l].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(speedType==='late') b.classList.add('selected-late'); });

        const w1e = document.getElementById('water1-early');
        const w1l = document.getElementById('water1-late');
        const f1e = document.getElementById('fork1-early');
        const f1l = document.getElementById('fork1-late');

        [w1e, f1e].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(oppositeSpeed==='early') b.classList.add('selected-early'); });
        [w1l, f1l].forEach(b => { b.classList.remove('selected-early', 'selected-late'); if(oppositeSpeed==='late') b.classList.add('selected-late'); });
    }

    function setGroup(groupName, type, btnElement) {
        const parentBlock = btnElement.closest('.column');
        if (!parentBlock) return;
        const masterBtns = parentBlock.querySelectorAll('.gc-switch-btn');
        masterBtns.forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');

        const sections = parentBlock.querySelectorAll('.section[data-group="' + groupName + '"]:not(.disabled-section)');
        sections.forEach(sec => {
            const rowLabel = sec.querySelector('.label span');
            const isJuso = rowLabel && rowLabel.innerText.includes('呪詛');

            const btns = sec.querySelectorAll('.touch-btn');
            btns.forEach(b => {
                if (b.innerText.startsWith('本当') || b.innerText.startsWith('嘘')) {
                    b.classList.remove('selected-true', 'selected-false');
                    if (type === 'true' && b.innerText.includes('本当')) {
                        b.classList.add('selected-true');
                    } else if (type === 'false' && b.innerText.includes('嘘')) {
                        b.classList.add('selected-false');
                    }
                }

                if (isJuso && b.classList.contains('btn-speed')) {
                    b.classList.remove('selected-early', 'selected-late');
                    if (groupName === 'gc1' && b.innerText === '早') {
                        b.classList.add('selected-early');
                    } else if (groupName === 'gc2' && b.innerText === '遅') {
                        b.classList.add('selected-late');
                    }
                }
            });
        });
    }

    function selectItem(btnElement, type) {
        const parentGroup = btnElement.parentElement;
        if (!parentGroup) return;
        const buttons = parentGroup.querySelectorAll('.btn-truth');
        buttons.forEach(btn => {
            btn.classList.remove('selected-true', 'selected-false');
        });
        if (type === 'true') {
            btnElement.classList.add('selected-true');
        } else {
            btnElement.classList.add('selected-false');
        }
    }

    function selectEffect(effectType, val, btnElement) {
        const parentGroup = btnElement.parentElement;
        if (!parentGroup) return;
        const buttons = parentGroup.getElementsByClassName('touch-btn');
        for(let btn of buttons) {
            btn.classList.remove('selected-true', 'selected-false');
        }
        if (val === 'true') {
            btnElement.classList.add('selected-true');
        } else {
            btnElement.classList.add('selected-false');
        }

        if (effectType === 'fire') {
            const resElem = document.getElementById('fire-res');
            if (val === 'true') {
                resElem.innerText = "本当：タケノコ";
                resElem.style.color = "#0a84ff";
            } else {
                resElem.innerText = "嘘：ドーナツ";
                resElem.style.color = "#ff453a";
            }
        } else if (effectType === 'water') {
            const resElem = document.getElementById('water-res');
            if (val === 'true') {
                resElem.innerText = "本当：ドーナツ";
                resElem.style.color = "#0a84ff";
            } else {
                resElem.innerText = "嘘：たけのこ";
                resElem.style.color = "#ff453a";
            }
        }
    }

    let state = { t1: null, t2: null, mc_top: null, mc_bottom: null };

    function selectMagicVal(targetKey, value, btnElement) {
        const parentDiv = btnElement.parentElement;
        parentDiv.querySelectorAll('.touch-btn').forEach(b => b.classList.remove('selected-true', 'selected-false'));
        
        if (value === 'shin') {
            btnElement.classList.add('selected-true');
            state[targetKey] = 'shin';
        } else {
            btnElement.classList.add('selected-false');
            state[targetKey] = 'uso';
        }
        calculate();
    }

    function calculate() {
        if (!state.t1 || !state.t2 || !state.mc_top || !state.mc_bottom) return;

        let thunderSafe = (state.t1 === state.mc_top);
        let blizzardSafe = (state.t2 === state.mc_bottom);

        let resultText = "";
        let resultColor = "";

        if (thunderSafe && blizzardSafe) {
            resultText = "🛡️ 両方踏まない";
            resultColor = "#30d158";
        } else if (!thunderSafe && !blizzardSafe) {
            resultText = "⚠️ 両方踏む！";
            resultColor = "#ff453a";
        } else if (!thunderSafe && blizzardSafe) {
            resultText = "⚡ サンダガを踏む";
            resultColor = "#ff9f0a";
        } else if (thunderSafe && !blizzardSafe) {
            resultText = "❄️ ブリザガを踏む";
            resultColor = "#0a84ff";
        }

        const mainElem = document.getElementById('res-main');
        mainElem.innerText = resultText;
        mainElem.style.color = resultColor;
    }

    function resetAll() {
        state = { t1: null, t2: null, mc_top: null, mc_bottom: null };
        const allBtns = document.querySelectorAll('.touch-btn');
        allBtns.forEach(b => b.classList.remove('selected-true', 'selected-false', 'selected-early', 'selected-late'));
        const masterBtns = document.querySelectorAll('.gc-switch-btn');
        masterBtns.forEach(b => b.classList.remove('active'));

        const sections = document.querySelectorAll('.section');
        sections.forEach(sec => {
            sec.classList.remove('disabled-section');
            const badge = sec.querySelector('.disable-badge');
            if (badge) {
                badge.innerText = "付与";
                badge.style.background = "#48484a";
                badge.style.color = "#fff";
            }
        });

        const mainElem = document.getElementById('res-main');
        mainElem.innerText = "未選択";
        mainElem.style.color = "#aeaeb2";

        document.getElementById('fire-res').innerText = "未選択";
        document.getElementById('fire-res').style.color = "#ff9f0a";
        document.getElementById('water-res').innerText = "未選択";
        document.getElementById('water-res').style.color = "#ff9f0a";
    }
</script>
